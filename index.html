<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#F8F5EE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>One more thing...</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <section class="screen" id="screen">

      <div class="content">

        <div class="eyebrow" id="eyebrow">
          One more thing...
        </div>

        <button class="touch-button" id="touchButton" aria-label="Continue">

          <div class="orb">
            <div class="orb-inner"></div>
          </div>

          <span class="touch-label" id="touchLabel">
            Tap to continue
          </span>

        </button>

        <div class="main-text" id="mainText"></div>

        <div class="progress-area" id="progressArea">

          <div class="progress-track">
            <div class="progress-bar" id="progressBar"></div>
          </div>

          <div class="progress-number" id="progressNumber">
            0%
          </div>

        </div>

        <div class="status-list" id="statusList"></div>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
